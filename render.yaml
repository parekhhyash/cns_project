services:
  - type: web
    name: cert-guard-lab
    runtime: python
    plan: free
    branch: certificate-validation-testbed
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn certlab.web.wsgi:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: CERTLAB_BEHIND_PROXY
        value: "1"
